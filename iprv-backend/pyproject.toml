[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iprv"
version = "0.4.7"
description = "Evidence-based IP Reputation Validator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "httpx>=0.27,<1", "python-dotenv>=1,<2", "certifi>=2026.10.19"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]
dev = ["ruff>=0.17,<1"]

[tool.setuptools.packages.find]
include = ["iprv*"]

[tool.setuptools.package-data]
iprv = ["static/*", "static/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"iprv/main.py" = ["B008"]
